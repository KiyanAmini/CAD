<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c0392b"/></marker></defs>
<rect width="1200" height="660" fill="white"/>
<text x="20" y="28" font-size="18" font-weight="bold">FP16 FCNN accelerator (784 -> 8 -> ReLU -> 10): datapath and module connections</text>
<text x="20" y="48" font-size="11.5" fill="#444">Black = FP16 data, red = control/status. One reusable FP16 multiplier and one FP16 adder (inside fp16_accumulator). Synchronous active-high rst, single clk.</text>
<rect x="300" y="70" width="740" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="92.0" text-anchor="middle" font-size="13" font-weight="bold">controller_fsm</text><text x="670.0" y="108.0" text-anchor="middle" font-size="10.5" fill="#444">drives every read_req/address, group/neuron/digit counters, start pulses, hidden/logit write enables; observes valid/full/last status</text>
<rect x="30" y="180" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="125.0" y="205.0" text-anchor="middle" font-size="13" font-weight="bold">input_memory</text><text x="125.0" y="221.0" text-anchor="middle" font-size="10.5" fill="#444">784 x FP16, 1-cycle read, 7 lanes</text>
<rect x="30" y="270" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="125.0" y="295.0" text-anchor="middle" font-size="13" font-weight="bold">weight_sram</text><text x="125.0" y="311.0" text-anchor="middle" font-size="10.5" fill="#444">908 rows x 7 x FP16, 7-cycle latency</text>
<rect x="30" y="360" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="125.0" y="385.0" text-anchor="middle" font-size="13" font-weight="bold">bias_memory</text><text x="125.0" y="401.0" text-anchor="middle" font-size="10.5" fill="#444">18 x FP16 (b1[0..7], b2[0..9])</text>
<rect x="300" y="225" width="190" height="60" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="395.0" y="252.0" text-anchor="middle" font-size="13" font-weight="bold">fp16_multiplier</text><text x="395.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#444">1 FP16 product / cycle</text>
<rect x="560" y="225" width="190" height="60" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="655.0" y="252.0" text-anchor="middle" font-size="13" font-weight="bold">ping_pong_buffer</text><text x="655.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#444">2 halves x 7 FP16</text>
<rect x="820" y="225" width="190" height="60" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="915.0" y="252.0" text-anchor="middle" font-size="13" font-weight="bold">fp16_accumulator</text><text x="915.0" y="268.0" text-anchor="middle" font-size="10.5" fill="#444">acc = FP16(acc + product)</text>
<rect x="820" y="340" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="915.0" y="365.0" text-anchor="middle" font-size="13" font-weight="bold">relu</text><text x="915.0" y="381.0" text-anchor="middle" font-size="10.5" fill="#444">negative -> +0</text>
<rect x="560" y="340" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="655.0" y="365.0" text-anchor="middle" font-size="13" font-weight="bold">layer2_register_file</text><text x="655.0" y="381.0" text-anchor="middle" font-size="10.5" fill="#444">h[0..7] (+2 spare regs)</text>
<rect x="820" y="440" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="915.0" y="465.0" text-anchor="middle" font-size="13" font-weight="bold">argmax</text><text x="915.0" y="481.0" text-anchor="middle" font-size="10.5" fill="#444">lowest-index maximum</text>
<rect x="560" y="440" width="190" height="56" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="655.0" y="465.0" text-anchor="middle" font-size="13" font-weight="bold">logit0..9, prediction</text><text x="655.0" y="481.0" text-anchor="middle" font-size="10.5" fill="#444">done: 1-cycle pulse</text>
<polyline points="220,208 260,208 260,240 300,240" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="224" y="200" font-size="10.5" fill="#333">7 pixels</text>
<polyline points="220,298 260,298 260,270 300,270" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="30" y="342" font-size="10.5" fill="#333">7 weights (controller staging)</text>
<polyline points="490,255 560,255" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="500" y="247" font-size="10.5" fill="#333">product</text>
<polyline points="750,255 820,255" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="752" y="247" font-size="10.5" fill="#333">7 ordered</text>
<polyline points="960,285 960,340" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="966" y="318" font-size="10.5" fill="#333">fc1 result</text>
<polyline points="820,368 750,368" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="752" y="360" font-size="10.5" fill="#333">hidden h[n]</text>
<polyline points="560,380 395,380 395,285" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="405" y="396" font-size="10.5" fill="#333">h[0..7] (FC2 operands)</text>
<polyline points="220,388 270,388 270,312 850,312 850,285" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="560" y="306" font-size="10.5" fill="#333">bias b1[n] / b2[d]</text>
<polyline points="1010,255 1060,255 1060,468 1010,468" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="1066" y="380" font-size="10.5" fill="#333">fc2 logit d</text>
<polyline points="820,468 750,468" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="300,95 125,95 125,180" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/><text x="130" y="88" font-size="10.5" fill="#c0392b">read_req + addr</text>
<polyline points="395,120 395,225" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/><text x="401" y="170" font-size="10.5" fill="#c0392b">start_group</text>
<polyline points="655,120 655,225" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/><text x="661" y="170" font-size="10.5" fill="#c0392b">consume_start</text>
<polyline points="915,120 915,225" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/><text x="921" y="170" font-size="10.5" fill="#c0392b">neuron_start / last</text>
<polyline points="1040,95 1100,95 1100,540 915,540 915,496" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#r)"/><text x="930" y="556" font-size="10.5" fill="#c0392b">argmax_start / logit_valid / index / last</text>
<text x="20" y="580" font-size="12"><tspan font-weight="bold">FC1:</tspan> for n=0..7, acc=b1[n]; for g=0..111 weight row n*112+g and pixels 7g..7g+6 give 7 products that are added in order; ReLU then stores h[n].</text>
<text x="20" y="600" font-size="12"><tspan font-weight="bold">FC2:</tspan> for d=0..9, acc=b2[d]; group 0 = h[0..6] (7 lanes), group 1 = h[7] (1 valid lane, 6 padding lanes masked); weight row = 896 + floor((8d+h)/7).</text>
<text x="20" y="620" font-size="12"><tspan font-weight="bold">Done:</tspan> argmax keeps the first (lowest-index) maximum, then done pulses once; logits and prediction stay stable until the next accepted start or reset.</text>
<text x="20" y="642" font-size="12" fill="#c0392b">Also from controller_fsm: hidden_write_en / hidden_write_addr to layer2_register_file, accumulator_start to fp16_accumulator, row/lane selection for FC2 weight gathering.</text></svg>