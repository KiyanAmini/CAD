<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="808" viewBox="0 0 1180 808" font-family="Helvetica,Arial,sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#333"/></marker></defs>
<rect width="1180" height="808" fill="white"/>
<text x="20" y="28" font-size="18" font-weight="bold">controller_fsm - state diagram (22 states, synchronous active-high reset to IDLE)</text>
<text x="20" y="48" font-size="11.5" fill="#444">Order follows the numbered boxes; loops: FC1 group loop (gidx 0..111), FC1 neuron loop (nidx 0..7), FC2 group loop (fgroup 0..1), FC2 digit loop (didx 0..9)</text>
<rect x="40" y="100" width="230" height="52" rx="6" fill="#fff7e6" stroke="#2f5597" stroke-width="1.5"/><text x="155.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold">1. IDLE</text><text x="155.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#444">wait start</text>
<rect x="310" y="100" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="425.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold">2. FC1_BIAS_REQ</text><text x="425.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#444">bias_read_req</text>
<rect x="580" y="100" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold">3. FC1_BIAS_WAIT</text><text x="695.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#444">wait bias_valid</text>
<rect x="850" y="100" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="123.0" text-anchor="middle" font-size="13" font-weight="bold">4. FC1_INPUT_WEIGHT_REQ</text><text x="965.0" y="139.0" text-anchor="middle" font-size="10.5" fill="#444">input+weight req</text>
<rect x="850" y="198" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="221.0" text-anchor="middle" font-size="13" font-weight="bold">5. FC1_OPERAND_WAIT</text><text x="965.0" y="237.0" text-anchor="middle" font-size="10.5" fill="#444">in_seen &amp; wt_seen &amp; write_ready</text>
<rect x="580" y="198" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="221.0" text-anchor="middle" font-size="13" font-weight="bold">6. FC1_MAC_START</text><text x="695.0" y="237.0" text-anchor="middle" font-size="10.5" fill="#444">multiplier_start</text>
<rect x="310" y="198" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="425.0" y="221.0" text-anchor="middle" font-size="13" font-weight="bold">7. FC1_GROUP_WAIT</text><text x="425.0" y="237.0" text-anchor="middle" font-size="10.5" fill="#444">wait buffer_full</text>
<rect x="40" y="198" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="155.0" y="221.0" text-anchor="middle" font-size="13" font-weight="bold">8. FC1_CONSUME_WAIT</text><text x="155.0" y="237.0" text-anchor="middle" font-size="10.5" fill="#444">valid&amp;ready&amp;last</text>
<rect x="40" y="296" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="155.0" y="319.0" text-anchor="middle" font-size="13" font-weight="bold">9. FC1_RESULT_WAIT</text><text x="155.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#444">wait result_valid</text>
<rect x="310" y="296" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="425.0" y="319.0" text-anchor="middle" font-size="13" font-weight="bold">10. FC1_RELU_STORE</text><text x="425.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#444">hidden_write_en</text>
<rect x="580" y="296" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="319.0" text-anchor="middle" font-size="13" font-weight="bold">11. FC2_ARGMAX_START</text><text x="695.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#444">argmax_start</text>
<rect x="850" y="296" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="319.0" text-anchor="middle" font-size="13" font-weight="bold">12. FC2_BIAS_REQ</text><text x="965.0" y="335.0" text-anchor="middle" font-size="10.5" fill="#444">bias addr 8+d</text>
<rect x="850" y="394" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="417.0" text-anchor="middle" font-size="13" font-weight="bold">13. FC2_BIAS_WAIT</text><text x="965.0" y="433.0" text-anchor="middle" font-size="10.5" fill="#444">wait bias_valid</text>
<rect x="580" y="394" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="417.0" text-anchor="middle" font-size="13" font-weight="bold">14. FC2_GROUP_PREP</text><text x="695.0" y="433.0" text-anchor="middle" font-size="10.5" fill="#444">l2 read + weight row</text>
<rect x="310" y="394" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="425.0" y="417.0" text-anchor="middle" font-size="13" font-weight="bold">15. FC2_GATHER_WAIT</text><text x="425.0" y="433.0" text-anchor="middle" font-size="10.5" fill="#444">gather lanes (2 rows max)</text>
<rect x="40" y="394" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="155.0" y="417.0" text-anchor="middle" font-size="13" font-weight="bold">16. FC2_OPERAND_WAIT</text><text x="155.0" y="433.0" text-anchor="middle" font-size="10.5" fill="#444">mask ok &amp; write_ready</text>
<rect x="40" y="492" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="155.0" y="515.0" text-anchor="middle" font-size="13" font-weight="bold">17. FC2_MAC_START</text><text x="155.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#444">multiplier_start</text>
<rect x="310" y="492" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="425.0" y="515.0" text-anchor="middle" font-size="13" font-weight="bold">18. FC2_GROUP_WAIT</text><text x="425.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#444">wait buffer_full</text>
<rect x="580" y="492" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="515.0" text-anchor="middle" font-size="13" font-weight="bold">19. FC2_CONSUME_WAIT</text><text x="695.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#444">valid&amp;ready&amp;last</text>
<rect x="850" y="492" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="515.0" text-anchor="middle" font-size="13" font-weight="bold">20. FC2_RESULT_WAIT</text><text x="965.0" y="531.0" text-anchor="middle" font-size="10.5" fill="#444">wait result_valid</text>
<rect x="850" y="590" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="965.0" y="613.0" text-anchor="middle" font-size="13" font-weight="bold">21. FC2_LOGIT_SEND</text><text x="965.0" y="629.0" text-anchor="middle" font-size="10.5" fill="#444">argmax_logit_valid</text>
<rect x="580" y="590" width="230" height="52" rx="6" fill="#eef3fb" stroke="#2f5597" stroke-width="1.5"/><text x="695.0" y="613.0" text-anchor="middle" font-size="13" font-weight="bold">22. COMPLETE_WAIT</text><text x="695.0" y="629.0" text-anchor="middle" font-size="10.5" fill="#444">wait argmax_done -> done</text>
