<text x="40" y="668" font-size="13" font-weight="bold">Loop-back and special transitions</text>
<text x="40" y="688" font-size="11.5"><tspan font-weight="bold">FC1_CONSUME_WAIT -> FC1_INPUT_WEIGHT_REQ</tspan>: gidx &lt; 111 (next 7-weight group, same neuron)</text>
<text x="40" y="705" font-size="11.5"><tspan font-weight="bold">FC1_RELU_STORE -> FC1_BIAS_REQ</tspan>: nidx &lt; 7 (next neuron); nidx == 7 -> FC2_ARGMAX_START</text>
<text x="40" y="722" font-size="11.5"><tspan font-weight="bold">FC2_CONSUME_WAIT -> FC2_GROUP_PREP</tspan>: fgroup == 0 (second group: h[7] only)</text>
<text x="40" y="739" font-size="11.5"><tspan font-weight="bold">FC2_LOGIT_SEND -> FC2_BIAS_REQ</tspan>: didx &lt; 9 (next digit); didx == 9 -> COMPLETE_WAIT</text>
<text x="40" y="756" font-size="11.5"><tspan font-weight="bold">COMPLETE_WAIT -> IDLE</tspan>: argmax_done: done pulses for exactly one cycle</text>
<text x="40" y="773" font-size="11.5"><tspan font-weight="bold">IDLE -> FC1_BIAS_REQ</tspan>: start accepted only while idle; start while busy ignored</text>
</svg>